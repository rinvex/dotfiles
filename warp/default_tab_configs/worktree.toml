# Default worktree tab config — used by Warp's "Worktree in" submenu (+ menu).
# Retargeted to `new-worktree` (dotfiles/bin) so a one-click worktree is a fully
# isolated, Herd-served checkout instead of a bare `git worktree add` under ~/.warp.
#   base branch  = the repo's currently checked-out branch
#   feature name = Warp's auto-generated name (e.g. mesa-coyote)
# For a chosen base branch and a real feature name use the "New worktree" /
# "New worktree + Claude" tab configs instead.

name = "Worktree"

[[panes]]
id = "main"
type = "{{pane_type}}"
directory = "{{repo}}"
commands = [
  "new-worktree {{repo}} \"$(git -C {{repo}} branch --show-current)\" {{autogenerated_branch_name}}",
]

[params.repo]
type = "repo"
description = "Repository to create worktree in"

[params.pane_type]
type = "text"
description = "Pane type (terminal or agent)"
default = "terminal"
